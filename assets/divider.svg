<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 20" width="900" height="20" role="img" aria-label="divider">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00ff9c"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>.d{animation:m 3s ease-in-out infinite alternate}@keyframes m{from{transform:translateX(-260px)}to{transform:translateX(260px)}}</style>
  <rect x="0" y="9" width="900" height="2" fill="url(#g)" opacity=".5"/>
  <circle class="d" cx="450" cy="10" r="4" fill="#00ff9c" filter="url(#glow)"/>
</svg>
