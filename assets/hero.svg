<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Cybersecurity illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#03231c"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff9c"/><stop offset="1" stop-color="#007a52"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00ff9c" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="sh"><path d="M450 40 L545 75 V150 C545 200 505 232 450 255 C395 232 355 200 355 150 V75 Z"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'Fira Code',Consolas,monospace;font-size:13px;fill:#00ff9c}
    .dim{fill:#5fd7a8;opacity:.7}
    .scan{animation:scan 3s linear infinite}
    @keyframes scan{0%{transform:translateY(40px)}100%{transform:translateY(255px)}}
    .pulse{animation:pulse 2.4s ease-in-out infinite;transform-origin:450px 150px}
    @keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
    .blink{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .dot{animation:pulse2 2s ease-in-out infinite}
    @keyframes pulse2{0%,100%{opacity:.2}50%{opacity:1}}
  </style>
  <rect width="900" height="300" rx="16" fill="url(#bg)"/>
  <rect width="900" height="300" rx="16" fill="url(#grid)"/>

  <!-- left terminal -->
  <g transform="translate(40,60)">
    <rect width="270" height="180" rx="10" fill="#0D1117" stroke="#00ff9c" stroke-opacity=".4"/>
    <circle cx="16" cy="16" r="5" fill="#ff5f56"/><circle cx="34" cy="16" r="5" fill="#ffbd2e"/><circle cx="52" cy="16" r="5" fill="#27c93f"/>
    <text class="mono" x="16" y="52">$ nmap -sV target</text>
    <text class="mono dim" x="16" y="76">22/tcp  open  ssh</text>
    <text class="mono dim" x="16" y="98">80/tcp  open  http</text>
    <text class="mono dim" x="16" y="120">443/tcp open  https</text>
    <text class="mono" x="16" y="148">$ <tspan class="blink">█</tspan></text>
  </g>

  <!-- shield -->
  <g class="pulse" filter="url(#glow)">
    <path d="M450 40 L545 75 V150 C545 200 505 232 450 255 C395 232 355 200 355 150 V75 Z" fill="url(#shield)" fill-opacity=".18" stroke="#00ff9c" stroke-width="3"/>
  </g>
  <g clip-path="url(#sh)"><rect class="scan" x="355" y="0" width="190" height="4" fill="#00ff9c" opacity=".8" filter="url(#glow)"/></g>
  <path d="M410 150 l30 30 l55 -62" fill="none" stroke="#00ff9c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- right: threat feed -->
  <g transform="translate(590,60)">
    <rect width="270" height="180" rx="10" fill="#0D1117" stroke="#00ff9c" stroke-opacity=".4"/>
    <text class="mono" x="16" y="30">VULN SUMMARY</text>
    <g font-family="Consolas,monospace" font-size="12">
      <text x="16" y="62" fill="#ff5f56">CRITICAL</text><rect x="100" y="52" width="40" height="10" rx="3" fill="#ff5f56" opacity=".85"/>
      <text x="16" y="88" fill="#ff9f43">HIGH</text><rect x="100" y="78" width="90" height="10" rx="3" fill="#ff9f43" opacity=".85"/>
      <text x="16" y="114" fill="#ffd32a">MEDIUM</text><rect x="100" y="104" width="130" height="10" rx="3" fill="#ffd32a" opacity=".85"/>
      <text x="16" y="140" fill="#00ff9c">LOW</text><rect x="100" y="130" width="70" height="10" rx="3" fill="#00ff9c" opacity=".85"/>
    </g>
    <circle class="dot" cx="245" cy="26" r="5" fill="#00ff9c"/>
  </g>

  <!-- connectors -->
  <path d="M310 150 H355" stroke="#00ff9c" stroke-opacity=".5" stroke-dasharray="4 4"/>
  <path d="M545 150 H590" stroke="#00ff9c" stroke-opacity=".5" stroke-dasharray="4 4"/>
</svg>
